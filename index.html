<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRT-Monitor</title>
  </head>
  <body>
    <div id="boot"><pre id="boot-log" aria-hidden="true"></pre></div>
    <div id="app" hidden>
      <header id="hd">
        <pre id="hd-logo" aria-hidden="true"></pre>
        <div id="hd-info">
          <div id="hd-host"></div>
          <div id="hd-cpu"></div>
        </div>
        <div id="hd-right">
          <div id="hd-clock"></div>
          <div id="hd-uptime"></div>
          <div id="hd-page"></div>
        </div>
      </header>
      <main id="grid">
        <div id="guides" hidden></div>
      </main>
      <div id="hint"></div>
      <div id="alert-banner" hidden></div>
      <div id="hotkeys" hidden></div>
      <button id="btn-cards" type="button" hidden>＋ CARDS</button>
      <div id="card-manager" hidden></div>
      <div id="settings-panel" hidden></div>
    </div>
    <div id="crt-overlay"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
