name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test app.tests/CrtMonitor.Tests.csproj -c Release

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Publish self-contained
        run: dotnet publish app/CrtMonitor.csproj -c Release -r win-x64 --self-contained true -o app/publish

      - name: Mirror frontend into wwwroot
        run: robocopy dist app/publish/wwwroot /MIR /NFL /NDL /NJH /NJS; if ($lastexitcode -le 7) { $global:LASTEXITCODE = 0 }

      - name: Build battery plugin
        run: |
          dotnet build plugins-src/BatteryPlugin/CrtMonitor.Plugin.Battery.csproj -c Release
          New-Item -ItemType Directory -Force -Path app/publish/plugins | Out-Null
          Copy-Item plugins-src/BatteryPlugin/bin/Release/net8.0-windows10.0.19041.0/CrtMonitor.Plugin.Battery.dll app/publish/plugins/

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path app/publish/* -DestinationPath CRT-Monitor-${{ github.ref_name }}-win-x64.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: CRT-Monitor-*.zip
          generate_release_notes: true
